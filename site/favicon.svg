<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="wireGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#06b6d4" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark Slate Rounded Badge -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Radial Grid Accent -->
  <circle cx="32" cy="32" r="22" fill="#06b6d4" fill-opacity="0.06"/>

  <!-- Isometric 3D Precision Cube Geometry -->
  <!-- Center: (32, 32), Radius: 18 -->
  <!-- Top: (32, 14), Top-Right: (47.6, 23), Bottom-Right: (47.6, 41), Bottom: (32, 50), Bottom-Left: (16.4, 41), Top-Left: (16.4, 23) -->

  <!-- Top Isometric Face -->
  <polygon points="32,14 47.6,23 32,32 16.4,23" fill="url(#topFace)" opacity="0.95"/>

  <!-- Left Isometric Face -->
  <polygon points="16.4,23 32,32 32,50 16.4,41" fill="url(#leftFace)" opacity="0.85"/>

  <!-- Right Isometric Face -->
  <polygon points="32,32 47.6,23 47.6,41 32,50" fill="url(#rightFace)" opacity="0.75"/>

  <!-- Glowing Wireframe Accent Overlay -->
  <g filter="url(#neonGlow)">
    <!-- Outer Contour -->
    <polygon points="32,14 47.6,23 47.6,41 32,50 16.4,41 16.4,23" fill="none" stroke="url(#wireGlow)" stroke-width="2" stroke-linejoin="round"/>
    <!-- Internal Intersection Spokes -->
    <line x1="32" y1="32" x2="32" y2="50" stroke="#f8fafc" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="32" y1="32" x2="47.6" y2="23" stroke="#f8fafc" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="32" y1="32" x2="16.4" y2="23" stroke="#f8fafc" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Center Precision Vertex Dot -->
    <circle cx="32" cy="32" r="2.2" fill="#f97316"/>
  </g>
</svg>
